<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SDN DoS/DDoS Guard</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1221 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-container {
      background: rgba(20, 30, 50, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(100, 150, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(50, 100, 200, 0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header h1 {
      color: #4a9eff;
      font-size: 28px;
      margin: 0 0 10px 0;
      font-weight: 600;
      text-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
    }
    .login-header p {
      color: #9fb3c8;
      font-size: 14px;
      margin: 0;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      color: #9fb3c8;
      font-size: 13px;
      font-weight: 500;
    }
    .form-group input {
      background: rgba(10, 20, 40, 0.6);
      border: 1px solid rgba(100, 150, 255, 0.2);
      border-radius: 10px;
      padding: 14px 16px;
      color: #e6ecf2;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-group input:focus {
      border-color: rgba(74, 158, 255, 0.6);
      box-shadow: 0 0 20px rgba(74, 158, 255, 0.2);
    }
    .form-group input::placeholder {
      color: rgba(159, 179, 200, 0.5);
    }
    .btn-login {
      background: linear-gradient(135deg, #4a9eff 0%, #2d7dd2 100%);
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(74, 158, 255, 0.4);
    }
    .error-msg {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }
    .footer-text {
      text-align: center;
      margin-top: 25px;
      color: rgba(159, 179, 200, 0.5);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>SDN DoS/DDoS Guard</h1>
      <p>DoS &amp; DDoS Protection System</p>
    </div>
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" placeholder="Enter username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-login">Sign In</button>
      {% if error %}
      <div class="error-msg" role="alert">{{ error }}</div>
      {% endif %}
    </form>
    <div class="footer-text">
      Enterprise SDN Security Dashboard
    </div>
  </div>
</body>
</html>
